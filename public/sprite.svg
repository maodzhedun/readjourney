<svg xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Logo - Book with bookmark -->
    <symbol id="icon-logo" viewBox="0 0 42 17" fill="none">
      <path d="M0 0.5H10.5C11.6046 0.5 12.5 1.39543 12.5 2.5V14.5C12.5 15.6046 11.6046 16.5 10.5 16.5H0V0.5Z" fill="currentColor"/>
      <path d="M14.5 0.5H25C26.1046 0.5 27 1.39543 27 2.5V14.5C27 15.6046 26.1046 16.5 25 16.5H14.5V0.5Z" fill="currentColor"/>
      <path d="M5 3.5V7.5L6.5 6L8 7.5V3.5H5Z" fill="#1f1f1f"/>
      <path d="M19 3.5V7.5L20.5 6L22 7.5V3.5H19Z" fill="#1f1f1f"/>
    </symbol>

    <!-- Window icon for Quote -->
    <symbol id="icon-window" viewBox="0 0 40 40" fill="none">
      <rect x="4" y="8" width="32" height="24" rx="4" stroke="currentColor" stroke-width="2"/>
      <circle cx="10" cy="14" r="2" fill="currentColor"/>
      <circle cx="18" cy="14" r="2" fill="currentColor"/>
      <rect x="24" y="12" width="8" height="4" rx="2" fill="currentColor"/>
    </symbol>

    <!-- Menu (Hamburger) -->
    <symbol id="icon-menu" viewBox="0 0 28 28" fill="none">
      <path d="M4 7H24M4 14H24M4 21H24" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>

    <!-- Close (X) -->
    <symbol id="icon-close" viewBox="0 0 28 28" fill="none">
      <path d="M7 7L21 21M21 7L7 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>

    <!-- Chevron Left -->
    <symbol id="icon-chevron-left" viewBox="0 0 24 24" fill="none">
      <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <!-- Chevron Right -->
    <symbol id="icon-chevron-right" viewBox="0 0 24 24" fill="none">
      <path d="M9 18L15 12L9 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <!-- Chevron Down -->
    <symbol id="icon-chevron-down" viewBox="0 0 24 24" fill="none">
      <path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <!-- Trash -->
    <symbol id="icon-trash" viewBox="0 0 14 14" fill="none">
      <path d="M1 3.5H13M11.5 3.5V12C11.5 12.5523 11.0523 13 10.5 13H3.5C2.94772 13 2.5 12.5523 2.5 12V3.5M4.5 3.5V2C4.5 1.44772 4.94772 1 5.5 1H8.5C9.05228 1 9.5 1.44772 9.5 2V3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <!-- Arrow Right -->
    <symbol id="icon-arrow-right" viewBox="0 0 24 24" fill="none">
      <path d="M5 12H19M19 12L12 5M19 12L12 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <!-- Eye -->
    <symbol id="icon-eye" viewBox="0 0 24 24" fill="none">
      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
    </symbol>

    <!-- Eye Off -->
    <symbol id="icon-eye-off" viewBox="0 0 24 24" fill="none">
      <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M1 1l22 22" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <!-- Book -->
    <symbol id="icon-book" viewBox="0 0 24 24" fill="none">
      <path d="M4 19.5A2.5 2.5 0 016.5 17H20" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <!-- Plus -->
    <symbol id="icon-plus" viewBox="0 0 24 24" fill="none">
      <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <!-- Check -->
    <symbol id="icon-check" viewBox="0 0 24 24" fill="none">
      <path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <!-- Play -->
    <symbol id="icon-play" viewBox="0 0 24 24" fill="none">
      <polygon points="5 3 19 12 5 21 5 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <!-- Stop -->
    <symbol id="icon-stop" viewBox="0 0 24 24" fill="none">
      <rect x="4" y="4" width="16" height="16" rx="2" stroke="currentColor" stroke-width="2"/>
    </symbol>
  </defs>
</svg>
